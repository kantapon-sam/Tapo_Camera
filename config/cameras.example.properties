# Copy this file to cameras.properties and configure your Tapo Camera Account.
# Local camera settings are ignored by Git.

grid.columns=2
live.autoStart=true

recordings.dir=recordings
recording.segmentSeconds=300
ffmpeg.path=ffmpeg

vlc.networkCachingMs=300
vlc.rtspTransport=tcp

# Copy rtsp-urls.example.txt to rtsp-urls.txt before starting the app.
rtsp.urls.file=config/rtsp-urls.txt

# Alternatively, enable this camera and fill in your account details.
# stream1 = high quality; stream2 = standard quality.
camera.1.enabled=false
camera.1.id=front
camera.1.name=Front Camera
camera.1.host=192.168.1.10
camera.1.port=554
camera.1.username=YOUR_CAMERA_ACCOUNT_USER
camera.1.password=YOUR_CAMERA_ACCOUNT_PASSWORD
camera.1.stream=stream1
